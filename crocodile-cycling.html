<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Riverside Ride</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: clamp(12px, 3vw, 36px);
      display: grid;
      place-items: center;
      background: #e4ece5;
    }
    main { width: min(100%, 980px); }
    svg { display: block; width: 100%; height: auto; border: 1px solid #6e8981; }
    .ink { stroke: #173932; stroke-linecap: round; stroke-linejoin: round; }
    .caption { font: 700 13px system-ui, sans-serif; fill: #284e43; }
    .title { font: 700 62px Georgia, serif; fill: #173932; }
  </style>
</head>
<body>
  <main>
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 630"
         role="img" aria-labelledby="scene-title scene-description">
      <title id="scene-title">Riverside Ride</title>
      <desc id="scene-description">A green crocodile pedals a coral bicycle along a riverside path.</desc>

      <defs>
        <g id="wheel" class="ink">
          <circle r="105" fill="#eef2df" fill-opacity=".36" stroke-width="10"/>
          <circle r="97" fill="none" stroke="#6b9280" stroke-width="2"/>
          <path d="M-95 0H95 M0-95V95 M-67-67 67 67 M-67 67 67-67
                   M-88-36 88 36 M-36-88 36 88 M-88 36 88-36 M36-88-36 88"
                fill="none" stroke="#648076" stroke-width="1.6"/>
          <path d="M0-96V-88 M68 68 63 63" stroke="#d97955" stroke-width="4"/>
          <circle r="9" fill="#f8df9e" stroke-width="3"/>
        </g>
        <g id="rail-post">
          <path d="M0 0V97" stroke="#789d8b" stroke-width="6"/>
          <path d="M-5 0H5" stroke="#789d8b" stroke-width="4" stroke-linecap="round"/>
        </g>
        <pattern id="road-dashes" width="97" height="9" patternUnits="userSpaceOnUse">
          <path d="M0 4H39" stroke="#f6eacf" stroke-width="3"/>
        </pattern>
      </defs>

      <g id="landscape" aria-hidden="true">
        <path fill="#edf2e5" d="M0 0H900V630H0z"/>
        <circle cx="751" cy="151" r="55" fill="#f4ce7f"/>
        <path d="M788 160h60m-36 10h54M84 201h88m-70 10h46M691 108h-51m24 10h-38"
              fill="none" stroke="#fff9e9" stroke-width="3" stroke-linecap="round"/>
        <path d="M0 325V283Q65 237 120 268T230 270Q279 234 342 266T463 266
                 Q540 221 613 259T750 254Q827 207 900 259V325Z" fill="#b9d5bb"/>
        <path d="M0 330V309Q50 273 98 294T206 284Q263 262 319 296T439 300
                 Q499 273 563 296T686 296Q749 264 805 288T900 279V330Z" fill="#8fb8a0"/>
        <path d="M0 320H900V470H0z" fill="#aad0c3"/>
        <path d="M13 344h109m35 0h54m488-4h69m18 0h87M42 385h68m666 4h105
                 M0 413h43m28 0h98m563 21h78m24 0h66M275 353h70m270 23h82"
              fill="none" stroke="#d7e8d8" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M0 401H900M0 438H900" fill="none" stroke="#789d8b" stroke-width="4"/>
        <use href="#rail-post" x="39" y="390"/>
        <use href="#rail-post" x="170" y="390"/>
        <use href="#rail-post" x="301" y="390"/>
        <use href="#rail-post" x="432" y="390"/>
        <use href="#rail-post" x="563" y="390"/>
        <use href="#rail-post" x="694" y="390"/>
        <use href="#rail-post" x="825" y="390"/>
        <path d="M0 470H900V630H0z" fill="#dbb993"/>
        <path d="M0 470H900V488H0z" fill="#f2d9ae"/>
        <path d="M0 496H900M0 596H900" fill="none" stroke="#bc957b" stroke-width="1.5"/>
        <path d="M0 573H900V582H0z" fill="url(#road-dashes)"/>
        <ellipse cx="444" cy="550" rx="320" ry="13" fill="#966d60" opacity=".22"/>
      </g>

      <g id="heading" aria-hidden="true">
        <text class="caption" x="51" y="49">THE RIVERSIDE CIRCUIT</text>
        <text class="title" x="47" y="112">Riverside Ride</text>
        <path d="M51 134h74" stroke="#cc7559" stroke-width="3"/>
      </g>

      <g id="wheels">
        <g transform="translate(239 442)">
          <g id="rear-wheel">
            <use href="#wheel"/>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360"
                              dur="1.1s" repeatCount="indefinite"/>
          </g>
        </g>
        <g transform="translate(655 442)">
          <g id="front-wheel">
            <use href="#wheel"/>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360"
                              dur="1.1s" repeatCount="indefinite"/>
          </g>
        </g>
      </g>

      <!-- The leg endpoints sample the crank circle every 45 degrees. -->
      <path id="far-leg" class="ink" d="M381 315 Q428 344 414 379 Q406 406 393 429"
            fill="none" style="stroke:#36694e;stroke-width:23">
        <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
                 values="M381 315 Q428 344 414 379 Q406 406 393 429;
                         M381 315 Q429 332 419 365 Q416 393 401 409;
                         M381 315 Q436 327 431 359 Q431 385 421 401;
                         M381 315 Q442 331 444 365 Q447 392 441 409;
                         M381 315 Q445 341 448 374 Q453 405 449 429;
                         M381 315 Q435 347 441 389 Q444 423 441 449;
                         M381 315 Q428 355 429 399 Q429 431 421 457;
                         M381 315 Q424 352 420 392 Q414 423 401 449;
                         M381 315 Q428 344 414 379 Q406 406 393 429"/>
      </path>
      <g id="far-pedal" transform="translate(421 429)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="180" to="540"
                            dur="1.6s" repeatCount="indefinite"/>
          <path class="ink" d="M0 0H28" fill="none" stroke-width="6"/>
          <g transform="translate(28 0)">
            <g transform="rotate(-180)">
              <animateTransform attributeName="transform" type="rotate" from="-180" to="-540"
                                dur="1.6s" repeatCount="indefinite"/>
              <path class="ink" d="M-10 2Q-15-7-10-13Q0-17 8-10L17-7Q23-3 20 2Z"
                    fill="#478259" stroke-width="3"/>
              <rect x="-13" y="2" width="37" height="7" rx="2" fill="#25453c"/>
            </g>
          </g>
        </g>
      </g>

      <g id="bicycle-frame" class="ink" fill="none">
        <path id="frame-tubes" d="M239 442 371 342 421 429 239 442
              M371 342 572 334 421 429 M572 334 655 442" stroke-width="15"/>
        <use href="#frame-tubes" style="stroke:#e97d58;stroke-width:9"/>
        <path d="M371 342 359 316 M572 334 561 308Q552 287 567 286H589"
              stroke-width="8"/>
        <path d="M570 287h20" stroke="#6b4f3d" stroke-width="11"/>
        <path d="M562 297c36 3 36 27 27 49" stroke-width="2.5"/>
        <path d="M332 316Q332 307 347 307L388 311Q398 312 395 320
                 Q371 326 343 325Q334 325 332 316Z" fill="#c1865f" stroke-width="4"/>
        <path d="M239 433 419 408A21 21 0 0 1 426 450L241 452"
              stroke="#39584c" stroke-width="3"/>
        <circle cx="239" cy="442" r="8" fill="#f4ce7f" stroke-width="3"/>
        <circle cx="655" cy="442" r="8" fill="#f4ce7f" stroke-width="3"/>
        <circle cx="421" cy="429" r="19" fill="#f4ce7f" stroke-width="4"/>
        <circle cx="421" cy="429" r="10" fill="#e97d58" stroke-width="2"/>
      </g>

      <path id="near-leg" class="ink" d="M375 310 Q442 332 445 369 Q451 399 449 429"
            fill="none" style="stroke:#569851;stroke-width:28">
        <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
                 values="M375 310 Q442 332 445 369 Q451 399 449 429;
                         M375 310 Q437 343 438 384 Q445 418 441 449;
                         M375 310 Q433 347 431 391 Q430 427 421 457;
                         M375 310 Q427 347 425 385 Q417 420 401 449;
                         M375 310 Q425 339 420 373 Q407 405 393 429;
                         M375 310 Q429 328 422 363 Q413 391 401 409;
                         M375 310 Q433 323 433 354 Q432 379 421 401;
                         M375 310 Q442 323 441 357 Q446 383 441 409;
                         M375 310 Q442 332 445 369 Q451 399 449 429"/>
      </path>
      <g id="near-pedal" transform="translate(421 429)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0" to="360"
                            dur="1.6s" repeatCount="indefinite"/>
          <path class="ink" d="M0 0H28" fill="none" stroke-width="7"/>
          <g transform="translate(28 0)">
            <g>
              <animateTransform attributeName="transform" type="rotate" from="0" to="-360"
                                dur="1.6s" repeatCount="indefinite"/>
              <path class="ink" d="M-11 3Q-15-6-10-14Q1-18 9-10L18-7Q25-3 22 3Z"
                    fill="#78ad5c" stroke-width="3"/>
              <path class="ink" d="M12-6l-2 5m8-4-2 5" fill="none" stroke-width="1.5"/>
              <rect class="ink" x="-14" y="3" width="40" height="8" rx="2"
                    fill="#e59862" stroke-width="2.5"/>
            </g>
          </g>
        </g>
      </g>

      <g id="crocodile" class="ink" stroke-width="4">
        <g id="upper-body">
          <animateTransform attributeName="transform" type="rotate" dur="1.6s"
                            values="0 375 319;2.6 375 319;0 375 319;-2.6 375 319;0 375 319"
                            calcMode="spline" keyTimes="0;.25;.5;.75;1"
                            keySplines=".33 .52 .67 1;.33 0 .67 .48;.33 .52 .67 1;.33 0 .67 .48"
                            repeatCount="indefinite"/>

          <g id="tail-and-body">
            <path d="M215 289l15-16 17 13 16-15 19 12 15-17 20 13 15-19 18 9
                     12-22 18 4 8-23 21 5 15-24 16 10-18 40-142 53Z" fill="#38734c"/>
            <path d="M181 279Q209 291 255 289Q304 287 339 268Q364 251 392 235
                     Q422 212 449 220Q469 222 471 248Q473 273 449 296
                     Q419 325 378 324Q339 330 284 324Q211 319 181 279Z" fill="#7eb65f"/>
            <path d="M210 299Q260 314 316 305Q374 295 402 262Q418 243 449 246
                     Q471 249 461 279Q440 314 398 321Q342 333 284 324Q240 320 210 299Z"
                  fill="#d7df8c" stroke="none"/>
            <path d="M181 279Q209 291 255 289Q304 287 339 268Q364 251 392 235
                     Q422 212 449 220Q469 222 471 248Q473 273 449 296
                     Q419 325 378 324Q339 330 284 324Q211 319 181 279Z" fill="none"/>
            <path d="M245 300q6 3 12 1m21-5q7 2 14-1m40-9q7 0 12-5m21-9q7-1 12-6"
                  fill="none" stroke="#508450" stroke-width="2.5"/>
            <path d="M396 278q17 7 37 7m-53 9q12 9 31 12" fill="none"
                  stroke="#a1ad66" stroke-width="2"/>
          </g>

          <g id="head">
            <path d="M426 230Q409 218 413 197Q415 179 430 174Q435 151 452 148
                     Q471 144 485 165Q497 156 509 165L529 175Q556 169 591 169
                     Q623 169 630 184Q637 197 622 207Q615 225 595 233
                     Q573 242 544 239L490 234Q451 252 426 230Z" fill="#80b95d"/>
            <path d="M485 215Q520 228 558 222Q600 218 623 204Q616 225 595 233
                     Q573 242 544 239L490 234Q472 241 455 239Q469 235 485 215Z"
                  fill="#dae58f" stroke="none"/>
            <path d="M426 230Q451 252 490 234L544 239Q573 242 595 233Q615 225 622 207"
                  fill="none"/>
            <path d="M498 215l7 12 9-10m29 5 7 11 8-13m26-5 8 9 6-14"
                  fill="#fff8df" stroke-width="2.4"/>
            <path d="M475 207q10-5 15 4q30 15 62 11q49-6 70-15" fill="none" stroke-width="3.4"/>
            <ellipse cx="460" cy="175" rx="16" ry="18" fill="#f8efbd" stroke-width="3"/>
            <ellipse cx="465" cy="175" rx="6" ry="10" fill="#173932" stroke="none"/>
            <circle cx="467" cy="171" r="2" fill="#fff9e8" stroke="none"/>
            <ellipse cx="608" cy="186" rx="5" ry="3" fill="#2c5742" stroke="none"/>
            <ellipse cx="591" cy="185" rx="3" ry="2" fill="#4b8052" stroke="none"/>
            <path d="M435 204q9 4 19 0m-12 8 6 1" fill="none" stroke="#4b8052" stroke-width="2"/>
          </g>
        </g>

        <!-- Keep the hands anchored at the handlebar while the shoulder shifts. -->
        <g id="arms-and-hands">
          <path d="M450 246Q475 277 499 277Q530 277 569 284" fill="none"
                stroke="#376e50" stroke-width="17"/>
          <ellipse cx="566" cy="285" rx="13" ry="9" fill="#508f55" stroke-width="3"/>
          <path d="M444 254Q468 263 484 291Q510 301 566 288" fill="none"
                style="stroke-width:25">
            <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
                     values="M444 254Q468 263 484 291Q510 301 566 288;
                             M447 257Q470 267 486 293Q511 303 566 288;
                             M444 254Q468 263 484 291Q510 301 566 288;
                             M441 251Q467 260 482 289Q509 299 566 288;
                             M444 254Q468 263 484 291Q510 301 566 288"/>
          </path>
          <path d="M444 254Q468 263 484 291Q510 301 566 288" fill="none"
                style="stroke:#7eb65f;stroke-width:18">
            <animate attributeName="d" dur="1.6s" repeatCount="indefinite"
                     values="M444 254Q468 263 484 291Q510 301 566 288;
                             M447 257Q470 267 486 293Q511 303 566 288;
                             M444 254Q468 263 484 291Q510 301 566 288;
                             M441 251Q467 260 482 289Q509 299 566 288;
                             M444 254Q468 263 484 291Q510 301 566 288"/>
          </path>
          <path d="M559 282Q565 276 576 277Q584 277 585 286Q584 294 575 296
                   Q564 298 558 294" fill="#89bd65" stroke-width="3"/>
          <path d="M574 281q3 4 1 8m5-9q3 4 1 7" fill="none" stroke-width="1.5"/>
        </g>
      </g>

      <path d="M51 608H849" stroke="#a67f68" stroke-width="1"/>
    </svg>
  </main>
</body>
</html>
