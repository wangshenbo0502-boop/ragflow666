<script>
    var isPC = IsPC();//获取是否为PC端
    function isPCFun() {
        if (isPC) {//如果是PC端加载PC的js和css
            $(".mobileStyle").remove();
            // dynamicLoadJs('./images/sk_base.js')
        } else {//如果是移动端加载移动端的js和css
            if (window.sessionStorage.getItem("isPc") == "true") {
                var oMeta = document.createElement('meta');
                oMeta.content = '';
                oMeta.name = 'viewport';
                document.getElementsByTagName('html')[0].appendChild(oMeta);
                $(".mobileStyle").remove();
                // dynamicLoadJs('./images/sk_base.js')
                $(function () {
                    $(".AppBtn").css('display', 'block');
                    $(".nav_wrap").addClass("AppBtnBox");
                })
            } else {
                $(".stylefile").remove();
                // dynamicLoadJs('./images/sk_base_mobile.js')
                $(function () {
                    $("html,body").animate({ scrollTop: 0 }, 100);
                })
            }
            $(function () {
                //切换pc移动
                $(".PcBtn").click(function () {
                    window.sessionStorage.setItem("isPc", "true")
                    window.location.reload()
                })
                $(".AppBtn").click(function () {
                    window.sessionStorage.setItem("isPc", "false")
                    window.location.reload()
                })
                $(".AppBtn2").click(function () {
                    window.sessionStorage.setItem("isPc", "false")
                    window.location.reload()
                })
            })
        }
    }
    isPCFun();
    $(function () {
        isPCFun();
    })
</script>

    <script>
    var currentPage = 2; //所在页从0开始
    var prevPage = currentPage - 1 //上一页
    var nextPage = currentPage + 1 //下一页
    var countPage = 3 //共多少页
    //document.write("共"+countPage+"页&nbsp;&nbsp;");
    //设置上一页代码
    if (countPage > 1 && currentPage != 0 && currentPage != 1)
    document.write("<li><a href=\"index.shtml\" class='fy'><span>首页</span></a></li><li><a href=\" index" + "_" + prevPage + "." + "shtml \" class='fy'><span>上一页</span></a></li> ");
    else if (countPage > 1 && currentPage != 0 && currentPage == 1)
    document.write("<li><a href=\"index.shtml\" class='fy'><span>首页</span></a></li><li><a href=\"index.shtml\" class='fy'><span>上一页</span></a></li>");
    else
    document.write("");
    //循环
    var num = 5;
    for (var i = 0 + (currentPage - 1 - (currentPage - 1) % num); i <= (num + (currentPage - 1 - (currentPage - 1) % num)) && (i < countPage); i++) {
    if (currentPage == i)
        document.write("<li><a class='noyau-cr-current'><span>" + (i + 1) + "</span></a></li>");
    else if (i == 0)
        document.write("<li><a href=\"index.shtml\" class='fy'><span>" + (i + 1) + "</span></a></li>");
    else
            document.write("<li><a href=\"index" + "_" + i + "." + "shtml\" class='fy'><span>" + (i + 1) + "</span></a></li>");
    }

    //设置下一页代码 
    if (countPage > 1 && currentPage != (countPage - 1))
    document.write("<li><a href=\"index" + "_" + nextPage + "." + "shtml\" class='fy'><span>下一页</span></a></li><li><a href=\"index_" + (countPage - 1) + ".shtml\" class='fy'><span>尾页</span></a></li>");
    else
    document.write("");

    //跳转页面
    document.write("<li class='mobileNone'><span class='noyau-cr-page-info'>共" + countPage + "页</span></li><li><span class='noyau-cr-page-info mobileNone'>跳转到第</span><span class='noyau-cr-page-info pcNome'>跳</span></li><li><p class='noyau-cr-box'><input type='text' id='num' size='4' value=" + (currentPage + 1) +" /><span class='noyau-cr-page-info pcNone'>/ " + countPage + "</span></p></li><li><span class='noyau-cr-page-info mobileNone'>页</span>" + "<input class='noyau-cr-page-goto' type='submit' value='确定' onclick='javascript:toPage()' /></li>");

    function toPage() {
    var _num = document.getElementById("num").value;
    if (isNaN(_num)) {
        alert("请输入数字");
        return false;
    }
    var str = "index" + "_" + (_num - 1) + "." + "shtml";
    var url = location.href.substring(0, location.href.lastIndexOf("/") + 1);
    if (_num <= 1 || _num == null)
        location.href = url + "index" + "." + "shtml";
    else if (_num > countPage)
        alert("本频道最多" + countPage + "页");
    else
        location.href = url + str;
    }
